<!doctype html><meta charset=utf-8><meta name="viewport" content="width=device-width, initial-scale=1"><title>m1 — вход героя</title>
<style>
:root{--enter:450ms;--stagger:60ms;--out:cubic-bezier(.22,1,.36,1)}
body{margin:0;font:18px/1.5 system-ui;color:#111;background:#f4f1ea}
.hero{min-height:100vh;display:grid;place-content:center;padding:48px}
.hero h1{font-size:64px;margin:0 0 16px;line-height:1.05}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(6px);
  animation:in var(--enter) var(--out) forwards}
.hero h1 span:nth-child(2){animation-delay:var(--stagger)}
.hero h1 span:nth-child(3){animation-delay:calc(var(--stagger)*2)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.after{min-height:120vh;padding:48px;background:#e6e0d3}
@media (prefers-reduced-motion:reduce){.hero h1 span{animation:none;opacity:1;transform:none;filter:none}}
</style>
<section class="hero"><h1><span>Слово</span> <span>второе</span> <span>третье</span></h1><p>Подзаголовок без движения.</p></section>
<section class="after"><h2>Дальше</h2><p>Секция для скролл-прохода.</p></section>
