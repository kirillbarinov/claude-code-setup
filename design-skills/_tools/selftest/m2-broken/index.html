<!doctype html><meta charset=utf-8><meta name="viewport" content="width=device-width, initial-scale=1"><title>m2 — сломанный вход</title>
<style>
body{margin:0;font:18px/1.5 system-ui;color:#111;background:#fff}
.hero{min-height:100vh;display:grid;place-content:center;padding:48px}
.reveal{opacity:0;animation:in 2.5s forwards}
@keyframes in{to{opacity:1}}
.after{min-height:120vh;padding:48px;background:#eee}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
</style>
<section class="hero"><h1 class="reveal">Заголовок, который исчезает под reduce</h1></section>
<section class="after"><h2>Дальше</h2></section>
<script>
// два первых секунды каждый кадр занят на 80 мс — длинные кадры
const t0 = performance.now();
(function busy(){ if (performance.now() - t0 > 2000) return; const s = performance.now(); while (performance.now() - s < 80) {} requestAnimationFrame(busy); })();
</script>
