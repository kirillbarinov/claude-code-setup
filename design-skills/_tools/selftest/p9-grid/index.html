<div class=grid>
  <article class=card><h3>Первая</h3><p>Описание длинное, на несколько строк подряд, чтобы карточка вытянулась заметно ниже соседних и цена уехала вниз вслед за абзацем.</p><p class=price>от 4 200 ₽</p></article>
  <article class=card><h3>Вторая</h3><p>Короткое описание.</p><p class=price>от 2 100 ₽</p></article>
