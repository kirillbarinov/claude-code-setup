<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастерская — о работе</title>
<style>
  body { margin: 0; font: 16px/1.55 Georgia, serif; color: #221f19; background: #f6f3ea; }
  main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .hero { display: grid; grid-template-columns: 3fr 2fr; gap: 40px; align-items: end; }
  /* На узкой ширине колонки складываются: фикстура должна ловить только «черту»,
     а не переполнение заодно. */
  @media (max-width: 700px) { .hero { grid-template-columns: 1fr; gap: 24px; } }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 20px; }
  p { max-width: 60ch; }
  /* Черта во всю высоту колонки, а содержимое прижато к низу:
     линия обводит пустоту над числом. */
  .stat { border-left: 1px solid #b8ad90; padding-left: 24px;
    display: flex; flex-direction: column; gap: 6px;
    align-self: stretch; justify-content: flex-end; }
  .stat b { font-size: 46px; line-height: 1; font-weight: 600; color: #6e5220; }
  .stat span { font-size: 14px; color: #4a4536; }
  a.btn { display: inline-block; padding: 14px 24px; min-height: 44px; box-sizing: border-box;
    background: #4a5a3c; color: #f6f3ea; text-decoration: none; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div>
      <h1>Книгу возвращают к жизни, а не заменяют новой</h1>
      <p>Переплёт, реставрация бумаги, восстановление корешка. Работаем с домашними
        библиотеками и архивами: сначала осмотр, потом смета, потом работа.</p>
      <p><a class="btn" href="#z">Рассчитать стоимость</a></p>
    </div>
    <aside class="stat">
      <b>1 400+</b>
      <span>книг восстановлено за 14 лет работы мастерской</span>
    </aside>
  </div>
</main>
</body>
</html>
