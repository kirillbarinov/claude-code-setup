<!doctype html><meta charset=utf-8><meta name="viewport" content="width=device-width, initial-scale=1"><title>движение</title>
<style>
body{font:16px/1.6 system-ui;color:#1a1a1a;background:#fff;margin:0;padding:24px}
.к{display:inline-block;padding:12px 20px;margin:0 8px 16px;background:#eee;border:0}
.a{transition:all .2s}
.b{transition:all .22s}
.c{transition:all .35s}
.d{transition:background-color .37s}
.e{transition:color .6s}
.f{transition:opacity 1.2s}
.g{transition:transform .9s}
.h{animation:пульс 2.5s infinite}
@keyframes пульс{50%{opacity:.7}}
</style>
<main>
<h1>Восемь скоростей</h1>
<p><button class="к a">Раз</button><button class="к b">Два</button><button class="к c">Три</button>
<button class="к d">Четыре</button><button class="к e">Пять</button><button class="к f">Шесть</button>
<button class="к g">Семь</button><span class="к h">Восемь</span></p>
</main>
